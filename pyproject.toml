[project]
name = "delivious"
version = "0.1.0"
description = "A python approach to D&D using Tkinter."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.6",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1",
    "pip-tools==7.6.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Syntax and undefined-name checks only. The game scripts predate a style pass.
select = ["E9", "F63", "F7", "F82"]
