name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.12, Tk, and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-pip python3-venv python3-tk xvfb

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Test
        run: xvfb-run -a .venv/bin/pytest

      - name: Audit dependencies
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt
